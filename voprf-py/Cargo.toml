[package]
name = "voprf_py"
version = "0.1.0"
edition = "2024"

[dependencies]
bincode = "1.3.3"
curve25519-dalek = { version = "4.1.3", features = ["group"] }
group = "0.13.0"
pyo3 = { version = "0.25.1", features = ["extension-module"] }
rand = "0.8"
rayon = "1.10.0"
serde = { version = "1.0.219", features = ["derive"] }
voprf = { version = "0.5.0", features = [
    "alloc",
    "danger",
    "ristretto255-ciphersuite",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
