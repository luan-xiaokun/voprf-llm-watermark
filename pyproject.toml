[project]
name = "watermark-suite"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.9.0",
    "bitstring>=4.3.1",
    "bls-lib>=1.0.1",
    "bplib",
    "cython>=3.1.3",
    "datasets>=4.0.0",
    "diffusers>=0.35.2",
    "diversity>=0.2.2",
    "einops==0.8.1",
    "msgpack==0.6.2",
    "nltk>=3.9.1",
    "numpy>=2.3.2",
    "openai>=1.99.9",
    "optimum>=2.0.0",
    "pandas>=2.3.1",
    "pyarrow>=21.0.0",
    "reedsolo>=1.7.0",
    "scikit-learn>=1.7.1",
    "scipy>=1.16.1",
    "sentence-transformers>=5.1.0",
    "setuptools>=70.2.0",
    "spacy>=3.8.7",
    "torch>=2.7.1",
    "transformers>=4.53.3",
    "vendi-score>=0.0.3",
    "voprf_py @ {root}/voprf-py",
    "wheel>=0.45.1",
]

[build-system]
requires = ["hatchling", "setuptools", "cython", "numpy"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
bplib = { git = "https://github.com/jfairoze/bplib.git" }

[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = ["human-eval>=1.0.3", "matplotlib>=3.10.5"]

[tool.uv]
index-strategy = "unsafe-best-match"
