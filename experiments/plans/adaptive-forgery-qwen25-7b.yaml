version: 1
name: adaptive-forgery-qwen25-7b-1000

models:
  qwen-forger:
    checkpoint: Qwen/Qwen2.5-7B
  qwen-ppl:
    checkpoint: Qwen/Qwen2.5-14B

datasets:
  c4-forgery:
    kind: c4
    format: jsonl
    path: data/c4_realnewslike_subset_1000.jsonl
    split: train
    prompt_field: prompt_text
    sample_id_field: original_index

defaults:
  device: cuda
  dtype: bfloat16

stages:
  forge_vow_default:
    kind: adaptive-forgery
    model: qwen-forger
    dataset: c4-forgery
    num_samples: 1000
    batch_size: 1
    seed: 42
    max_new_tokens: 210
    max_candidates: 8
    watermark:
      method: vow
      enabled: true
      window_size: 4
      gamma: 0.5
      delta: 2.5
      server_seed_path: data/server_seed
      naive_baseline: false
    allow_special_tokens: false
    trace_level: compact

  detect_forgery:
    kind: detection
    input: forge_vow_default
    batch_size: 64
    target_field: generated_text
    token_num: null
    significance_levels: [0.000001, 0.00001, 0.0001, 0.001, 0.01]
    use_local: true
    step_size: 10

  evaluate_forgery_ppl:
    kind: perplexity
    input: detect_forgery
    model: qwen-ppl
    batch_size: 2
    max_length: 2048
    prompt_field: prompt_text
    target_field: generated_text
