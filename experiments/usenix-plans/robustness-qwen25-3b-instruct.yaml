version: 1
name: robustness-qwen25-3b-instruct

models:
  qwen-instruct:
    checkpoint: Qwen/Qwen2.5-3B-Instruct
  synonym-replacer:
    checkpoint: distilbert/distilbert-base-uncased

datasets:
  eli5-robustness:
    kind: eli5
    format: huggingface
    path: data/eli5
    split: train
    prompt_field: question
    sample_id_field: null

defaults:
  device: cuda
  dtype: bfloat16
  repetitions: 1

stages:
  # Six schemes share the same 500-prompt population and decoding policy.
  generate_robustness:
    kind: generation
    model: qwen-instruct
    dataset: eli5-robustness
    num_samples: 500
    batch_size: 32
    seed: 42
    max_new_tokens: 600
    do_sample: true
    top_p: null
    top_k: 50
    temperature: 0.7
    suppress_eos: false
    stop_strings: null
    sweep:
      watermark:
        - &vow_h1
          method: vow
          enabled: true
          window_size: 1
          gamma: 0.5
          delta: 2.5
          server_seed_path: data/server_seed
          naive_baseline: false
        - &vow_h2
          method: vow
          enabled: true
          window_size: 2
          gamma: 0.5
          delta: 2.5
          server_seed_path: data/server_seed
          naive_baseline: false
        - &vow_h4
          method: vow
          enabled: true
          window_size: 4
          gamma: 0.5
          delta: 2.5
          server_seed_path: data/server_seed
          naive_baseline: false
        - &lefthash
          method: lefthash
          enabled: true
          gamma: 0.25
          delta: 2.0
        - &selfhash
          method: selfhash
          enabled: true
          gamma: 0.25
          delta: 2.0
        - &upv
          method: upv
          enabled: true
          detector_dir: experiments/upv_baseline/model
          calibration_path: experiments/upv_baseline/private_detector_calibration.json
          window_size: 4
          gamma: 0.5
          delta: 2.0
          bit_number: 18
          layers: 5
          beam_size: 0

  generate_rdf_robustness:
    kind: generation
    model: qwen-instruct
    dataset: eli5-robustness
    num_samples: 500
    batch_size: 16
    seed: 42
    max_new_tokens: 600
    do_sample: true
    top_p: null
    top_k: 50
    temperature: 0.7
    suppress_eos: false
    stop_strings: null
    watermark: &rdf
      method: rdf
      enabled: true
      length: 256
      seed: 42
      watermark_device: cpu
      n_runs: 100

  generate_pdw_robustness:
    kind: generation
    model: qwen-instruct
    dataset: eli5-robustness
    num_samples: 500
    batch_size: 8
    seed: 42
    max_new_tokens: 600
    do_sample: true
    top_p: null
    top_k: 50
    temperature: 0.7
    suppress_eos: false
    stop_strings: null
    watermark: &pdw
      method: pdw
      enabled: true
      sk_path: data/pdw/sk
      pk_path: data/pdw/pk
      params_path: data/pdw/params
      signature_segment_length: 16
      bit_size: 2
      message_length: 8
      max_planted_errors: 2
      seed: 0

  # This single 500-sample control Artifact is scored by all eight detectors.
  generate_unwatermarked:
    kind: generation
    model: qwen-instruct
    dataset: eli5-robustness
    num_samples: 500
    batch_size: 32
    seed: 42
    max_new_tokens: 600
    do_sample: true
    top_p: null
    top_k: 50
    temperature: 0.7
    suppress_eos: false
    stop_strings: null
    watermark:
      method: none
      enabled: false

  transform_robustness:
    kind: robustness
    input: generate_robustness
    batch_size: 16
    target_field: generated_text
    seed: 42
    sweep:
      transformation:
        - &synonym_attack
          method: masked-lm-replacement
          model: synonym-replacer
          replacement_rate: 0.3
          top_k: 15
          candidate_sampling: score-weighted
        - &gpt35_attack
          method: openai-paraphrase
          model: gpt-3.5-turbo-0125
          max_output_tokens: 600
          temperature: 0.7
          reasoning_effort: null
          instruction: >-
            Rewrite the supplied text in different wording while preserving
            its information and approximate length. Return only the rewritten
            text.
        - &luna_attack
          method: openai-paraphrase
          model: gpt-5.6-luna
          max_output_tokens: 600
          temperature: 0.7
          reasoning_effort: low
          instruction: >-
            Rewrite the supplied text in different wording while preserving
            its information and approximate length. Return only the rewritten
            text.

  transform_rdf_robustness:
    kind: robustness
    input: generate_rdf_robustness
    batch_size: 8
    target_field: generated_text
    seed: 42
    sweep:
      transformation:
        - *synonym_attack
        - *gpt35_attack
        - *luna_attack

  # The manuscript deliberately leaves PDW + Luna unmeasured (---).
  transform_pdw_robustness:
    kind: robustness
    input: generate_pdw_robustness
    batch_size: 8
    target_field: generated_text
    seed: 42
    sweep:
      transformation:
        - *synonym_attack
        - *gpt35_attack

  detect_robustness:
    kind: detection
    input: transform_robustness
    batch_size: 32
    target_field: transformed_text
    token_num: null
    significance_levels: [0.01]
    use_local: true
    step_size: null

  detect_rdf_robustness:
    kind: detection
    input: transform_rdf_robustness
    batch_size: 16
    target_field: transformed_text
    token_num: null
    significance_levels: [0.01]
    use_local: true
    step_size: null

  detect_pdw_robustness:
    kind: detection
    input: transform_pdw_robustness
    batch_size: 16
    target_field: transformed_text
    token_num: null
    significance_levels: [0.01]
    use_local: true
    step_size: null

  # Detector overrides let every scheme score the same negative texts.
  detect_unwatermarked:
    kind: detection
    input: generate_unwatermarked
    batch_size: 32
    target_field: generated_text
    token_num: null
    significance_levels: [0.01]
    use_local: true
    step_size: null
    sweep:
      detector_watermark:
        - *vow_h1
        - *vow_h2
        - *vow_h4
        - *lefthash
        - *selfhash
        - *rdf
        - *pdw
        - *upv

  evaluate_robustness_similarity:
    kind: text-evaluation
    input: transform_robustness
    metric_set: [similarity]
    embedding_provider: openai
    embedding_model: text-embedding-3-large
    embedding_dimensions: null
    batch_size: 128
    reference_field: original_text
    target_field: transformed_text
    group_field: null

  evaluate_rdf_robustness_similarity:
    kind: text-evaluation
    input: transform_rdf_robustness
    metric_set: [similarity]
    embedding_provider: openai
    embedding_model: text-embedding-3-large
    embedding_dimensions: null
    batch_size: 128
    reference_field: original_text
    target_field: transformed_text
    group_field: null

  evaluate_pdw_robustness_similarity:
    kind: text-evaluation
    input: transform_pdw_robustness
    metric_set: [similarity]
    embedding_provider: openai
    embedding_model: text-embedding-3-large
    embedding_dimensions: null
    batch_size: 128
    reference_field: original_text
    target_field: transformed_text
    group_field: null

  assemble_robustness:
    kind: result-aggregation
    inputs:
      - detect_robustness
      - detect_rdf_robustness
      - detect_pdw_robustness
      - detect_unwatermarked
      - evaluate_robustness_similarity
      - evaluate_rdf_robustness_similarity
      - evaluate_pdw_robustness_similarity
    recipe: robustness
    confidence_level: 0.95
    threshold_policy:
      default: 0.01
