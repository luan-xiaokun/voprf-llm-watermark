version: 1
name: fpr-calibration-qwen25-3b-c4

models:
  qwen-tokenizer:
    checkpoint: Qwen/Qwen2.5-3B

datasets:
  c4-null-stream:
    kind: huggingface-stream
    path: allenai/c4
    config: realnewslike
    split: train
    revision: 1588ec454efa1a09f29cd18ddd04fe05fc8653a2
    text_field: text

stages:
  build_c4_null_windows:
    kind: token-window-corpus
    dataset: c4-null-stream
    tokenizer: qwen-tokenizer
    sample_num: 1000000
    window_token_num: 200
    max_windows_per_document: 1
    selection_seed: 42
    shuffle_buffer_size: 10000
    stream_batch_size: 512
    checkpoint_sample_num: 8192

  detect_vow_null:
    kind: null-detection
    input: build_c4_null_windows
    detector_watermark:
      method: vow
      enabled: true
      window_size: 4
      gamma: 0.5
      delta: 2.5
      server_seed_path: data/server_seed
      naive_baseline: false
    sample_num: 1000000
    detector_batch_size: 2048
    concurrent_batches: 4
    max_in_flight_batches: 8
    intraop_threads: 1
    significance_levels: [0.01, 0.001, 0.0001, 0.00001]
    device: cpu

  detect_lefthash_null:
    kind: null-detection
    input: build_c4_null_windows
    detector_watermark:
      method: lefthash
      enabled: true
      gamma: 0.25
      delta: 2.0
    sample_num: 1000000
    detector_batch_size: 256
    concurrent_batches: 4
    max_in_flight_batches: 8
    intraop_threads: 1
    significance_levels: [0.01, 0.001, 0.0001, 0.00001]
    device: cuda:0

  detect_selfhash_null:
    kind: null-detection
    input: build_c4_null_windows
    detector_watermark:
      method: selfhash
      enabled: true
      gamma: 0.25
      delta: 2.0
    sample_num: 1000000
    detector_batch_size: 256
    concurrent_batches: 4
    max_in_flight_batches: 8
    intraop_threads: 1
    significance_levels: [0.01, 0.001, 0.0001, 0.00001]
    device: cuda:0

  detect_rdf_null:
    kind: null-detection
    input: build_c4_null_windows
    detector_watermark:
      method: rdf
      enabled: true
      length: 256
      seed: 42
      watermark_device: cpu
      n_runs: 100
    sample_num: 100000
    detector_batch_size: 32
    concurrent_batches: 10
    max_in_flight_batches: 20
    intraop_threads: 4
    significance_levels: [0.01]
    device: cpu

  assemble_fpr_calibration:
    kind: result-aggregation
    inputs:
      - detect_vow_null
      - detect_lefthash_null
      - detect_selfhash_null
      - detect_rdf_null
    recipe: fpr-calibration
    significance_levels: [0.01, 0.001, 0.0001, 0.00001]
    confidence_level: 0.95
