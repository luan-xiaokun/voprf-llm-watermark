version: 1
name: vow-h2-parameter-grid-qwen25-3b-1000

models:
  qwen-generation:
    checkpoint: Qwen/Qwen2.5-3B
  qwen-ppl:
    checkpoint: Qwen/Qwen2.5-7B

datasets:
  c4-evaluation:
    kind: c4
    format: jsonl
    path: data/c4_realnewslike_subset_1000.jsonl
    split: train
    prompt_field: prompt_text
    sample_id_field: original_index

defaults:
  device: cuda
  dtype: bfloat16
  repetitions: 1

stages:
  # Full 7 x 7 VOW parameter grid under multinomial sampling. The top-50
  # branch is intentionally deferred because its projected runtime exceeds
  # the current eight-hour budget.
  generate_vow_multinomial:
    kind: generation
    model: qwen-generation
    dataset: c4-evaluation
    num_samples: 1000
    batch_size: 64
    seed: 42
    max_new_tokens: 210
    do_sample: true
    top_p: null
    top_k: null
    temperature: 0.7
    suppress_eos: true
    stop_strings: null
    sweep:
      watermark:
        - &vow_h2_base
          method: vow
          enabled: true
          window_size: 2
          gamma: 0.125
          delta: 1.0
          server_seed_path: data/server_seed
          naive_baseline: false
        - {<<: *vow_h2_base, gamma: 0.125, delta: 1.5}
        - {<<: *vow_h2_base, gamma: 0.125, delta: 2.0}
        - {<<: *vow_h2_base, gamma: 0.125, delta: 2.5}
        - {<<: *vow_h2_base, gamma: 0.125, delta: 3.0}
        - {<<: *vow_h2_base, gamma: 0.125, delta: 3.5}
        - {<<: *vow_h2_base, gamma: 0.125, delta: 4.0}
        - {<<: *vow_h2_base, gamma: 0.25, delta: 1.0}
        - {<<: *vow_h2_base, gamma: 0.25, delta: 1.5}
        - {<<: *vow_h2_base, gamma: 0.25, delta: 2.0}
        - {<<: *vow_h2_base, gamma: 0.25, delta: 2.5}
        - {<<: *vow_h2_base, gamma: 0.25, delta: 3.0}
        - {<<: *vow_h2_base, gamma: 0.25, delta: 3.5}
        - {<<: *vow_h2_base, gamma: 0.25, delta: 4.0}
        - {<<: *vow_h2_base, gamma: 0.375, delta: 1.0}
        - {<<: *vow_h2_base, gamma: 0.375, delta: 1.5}
        - {<<: *vow_h2_base, gamma: 0.375, delta: 2.0}
        - {<<: *vow_h2_base, gamma: 0.375, delta: 2.5}
        - {<<: *vow_h2_base, gamma: 0.375, delta: 3.0}
        - {<<: *vow_h2_base, gamma: 0.375, delta: 3.5}
        - {<<: *vow_h2_base, gamma: 0.375, delta: 4.0}
        - {<<: *vow_h2_base, gamma: 0.5, delta: 1.0}
        - {<<: *vow_h2_base, gamma: 0.5, delta: 1.5}
        - {<<: *vow_h2_base, gamma: 0.5, delta: 2.0}
        - {<<: *vow_h2_base, gamma: 0.5, delta: 2.5}
        - {<<: *vow_h2_base, gamma: 0.5, delta: 3.0}
        - {<<: *vow_h2_base, gamma: 0.5, delta: 3.5}
        - {<<: *vow_h2_base, gamma: 0.5, delta: 4.0}
        - {<<: *vow_h2_base, gamma: 0.625, delta: 1.0}
        - {<<: *vow_h2_base, gamma: 0.625, delta: 1.5}
        - {<<: *vow_h2_base, gamma: 0.625, delta: 2.0}
        - {<<: *vow_h2_base, gamma: 0.625, delta: 2.5}
        - {<<: *vow_h2_base, gamma: 0.625, delta: 3.0}
        - {<<: *vow_h2_base, gamma: 0.625, delta: 3.5}
        - {<<: *vow_h2_base, gamma: 0.625, delta: 4.0}
        - {<<: *vow_h2_base, gamma: 0.75, delta: 1.0}
        - {<<: *vow_h2_base, gamma: 0.75, delta: 1.5}
        - {<<: *vow_h2_base, gamma: 0.75, delta: 2.0}
        - {<<: *vow_h2_base, gamma: 0.75, delta: 2.5}
        - {<<: *vow_h2_base, gamma: 0.75, delta: 3.0}
        - {<<: *vow_h2_base, gamma: 0.75, delta: 3.5}
        - {<<: *vow_h2_base, gamma: 0.75, delta: 4.0}
        - {<<: *vow_h2_base, gamma: 0.875, delta: 1.0}
        - {<<: *vow_h2_base, gamma: 0.875, delta: 1.5}
        - {<<: *vow_h2_base, gamma: 0.875, delta: 2.0}
        - {<<: *vow_h2_base, gamma: 0.875, delta: 2.5}
        - {<<: *vow_h2_base, gamma: 0.875, delta: 3.0}
        - {<<: *vow_h2_base, gamma: 0.875, delta: 3.5}
        - {<<: *vow_h2_base, gamma: 0.875, delta: 4.0}

  detect_vow_multinomial:
    kind: detection
    input: generate_vow_multinomial
    batch_size: 64
    target_field: generated_text
    token_num: null
    significance_levels: [0.00001]
    use_local: true
    step_size: null

  evaluate_vow_multinomial_ppl:
    kind: perplexity
    input: detect_vow_multinomial
    model: qwen-ppl
    batch_size: 16
    max_length: 2048
    prompt_field: prompt_text
    target_field: generated_text

  generate_unwatermarked_multinomial:
    kind: generation
    model: qwen-generation
    dataset: c4-evaluation
    num_samples: 1000
    batch_size: 64
    seed: 42
    max_new_tokens: 210
    do_sample: true
    top_p: null
    top_k: null
    temperature: 0.7
    suppress_eos: true
    stop_strings: null
    watermark:
      method: none
      enabled: false

  evaluate_unwatermarked_multinomial_ppl:
    kind: perplexity
    input: generate_unwatermarked_multinomial
    model: qwen-ppl
    batch_size: 16
    max_length: 2048
    prompt_field: prompt_text
    target_field: generated_text

  assemble_multinomial_tpr_vs_ppl:
    kind: result-aggregation
    inputs:
      - detect_vow_multinomial
      - evaluate_vow_multinomial_ppl
      - evaluate_unwatermarked_multinomial_ppl
    recipe: tpr-vs-ppl
    confidence_level: 0.95
    threshold_policy:
      default: 0.00001
