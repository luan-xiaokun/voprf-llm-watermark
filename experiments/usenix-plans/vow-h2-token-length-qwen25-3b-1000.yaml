version: 1
name: vow-h2-token-length-qwen25-3b-1000

models:
  qwen-generation:
    checkpoint: Qwen/Qwen2.5-3B

datasets:
  c4-evaluation:
    kind: c4
    format: jsonl
    path: data/c4_realnewslike_subset_1000.jsonl
    split: train
    prompt_field: prompt_text
    sample_id_field: original_index

defaults:
  device: cuda
  dtype: bfloat16
  repetitions: 1

stages:
  # Identical to the completed h=2 parameter-grid Run at gamma=0.5,
  # delta=3.0, so the existing generation Artifact is reused.
  generate_vow_h2_multinomial_default:
    kind: generation
    model: qwen-generation
    dataset: c4-evaluation
    num_samples: 1000
    batch_size: 64
    seed: 42
    max_new_tokens: 210
    do_sample: true
    top_p: null
    top_k: null
    temperature: 0.7
    suppress_eos: true
    stop_strings: null
    watermark:
      method: vow
      enabled: true
      window_size: 2
      gamma: 0.5
      delta: 3.0
      server_seed_path: data/server_seed
      naive_baseline: false

  detect_vow_h2_token_length:
    kind: detection
    input: generate_vow_h2_multinomial_default
    batch_size: 64
    target_field: generated_text
    token_num: null
    significance_levels: [0.00001]
    use_local: true
    step_size: 5

  assemble_vow_h2_tpr_vs_token_length:
    kind: result-aggregation
    inputs:
      - detect_vow_h2_token_length
    recipe: tpr-vs-token-length
    confidence_level: 0.95
    threshold_policy:
      default: 0.00001
