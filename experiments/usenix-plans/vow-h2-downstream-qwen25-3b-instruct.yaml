version: 1
name: vow-h2-downstream-qwen25-3b-instruct

models:
  qwen-instruct:
    checkpoint: Qwen/Qwen2.5-3B-Instruct

defaults:
  device: cuda
  dtype: bfloat16

stages:
  # Run only the VOW configurations whose h=4 downstream results are being
  # replaced. Existing baseline results do not need to be regenerated.
  evaluate_gsm8k:
    kind: downstream
    task: gsm8k
    model: qwen-instruct
    batch_size: 32
    seed: 42
    max_new_tokens: 1024
    num_shots: 4
    evaluation_workers: 4
    execution_timeout: 3.0
    sweep:
      watermark:
        - &vow_h2_delta_2_5
          method: vow
          enabled: true
          window_size: 2
          gamma: 0.5
          delta: 2.5
          server_seed_path: data/server_seed
          naive_baseline: false
        - &vow_h2_delta_2_0
          method: vow
          enabled: true
          window_size: 2
          gamma: 0.5
          delta: 2.0
          server_seed_path: data/server_seed
          naive_baseline: false

  evaluate_humaneval:
    kind: downstream
    task: humaneval
    model: qwen-instruct
    batch_size: 32
    seed: 42
    max_new_tokens: 1024
    num_shots: 0
    evaluation_workers: 4
    execution_timeout: 3.0
    sweep:
      watermark:
        - *vow_h2_delta_2_5
        - *vow_h2_delta_2_0

  assemble_vow_h2_downstream_performance:
    kind: result-aggregation
    inputs:
      - evaluate_gsm8k
      - evaluate_humaneval
    recipe: downstream-performance
    confidence_level: 0.95
    threshold_policy:
      default: 0.00001
